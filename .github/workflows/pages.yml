name: Deploy Jakeartspace portfolio
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "portfolio-assets.zip"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Build website
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          if [ -f portfolio-assets.zip ]; then
            unzip -oq portfolio-assets.zip -d _site
          else
            echo "portfolio-assets.zip has not been uploaded yet."
          fi
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
